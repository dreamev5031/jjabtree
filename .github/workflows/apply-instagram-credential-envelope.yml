name: Apply Instagram Credential Envelope

on:
  push:
    branches:
      - "ops/live-manifest-export-*"

permissions:
  contents: read

concurrency:
  group: jjabtree-instagram-credential-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global @railway/cli@latest
      - run: python -m pip install --disable-pip-version-check cryptography==45.0.6
      - run: >-
          python -m py_compile
          .github/scripts/railway_production_diagnose.py
          .github/scripts/railway_production_remediate.py
          .github/scripts/apply_instagram_credential_envelope.py
      - run: python .github/scripts/apply_instagram_credential_envelope.py
      - if: always() && hashFiles('jjabtree-credential-apply-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jjabtree-credential-apply-${{ github.sha }}
          path: jjabtree-credential-apply-result.json
          if-no-files-found: error
          retention-days: 7
