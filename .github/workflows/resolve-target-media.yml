name: Resolve Target Instagram Media

on:
  push:
    branches:
      - "ops/live-manifest-export-*"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global @railway/cli@latest
      - run: python -m pip install --disable-pip-version-check cryptography==45.0.6
      - run: >-
          python -m py_compile
          .github/scripts/railway_production_diagnose.py
          .github/scripts/railway_production_remediate.py
          .github/scripts/apply_instagram_credential_envelope.py
          .github/scripts/resolve_target_media.py
      - run: python .github/scripts/resolve_target_media.py
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-target-media-${{ github.sha }}
          path: resolved-target-media.json
          if-no-files-found: error
          retention-days: 7
